name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version from tag
        run: |
          V="${GITHUB_REF_NAME#v}"
          jq --arg v "$V" --arg r "$GITHUB_REPOSITORY" \
            '.version=$v | .url="https://github.com/\($r)" | .manifest="https://github.com/\($r)/releases/latest/download/module.json" | .download="https://github.com/\($r)/releases/download/v\($v)/daggerheart-uk.zip"' \
            module/module.json > m.json && mv m.json module/module.json
      - name: Zip
        run: cd module && zip -r ../daggerheart-uk.zip .
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            daggerheart-uk.zip
            module/module.json
